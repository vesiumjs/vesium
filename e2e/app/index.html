<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vesium E2E App</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: system-ui, sans-serif;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 8px 12px;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
        flex-shrink: 0;
      }
      nav a {
        color: #333;
        font-size: 13px;
        text-decoration: none;
      }
      nav a.router-link-active {
        color: #42b983;
        font-weight: 600;
      }
      main {
        flex: 1;
        position: relative;
        min-height: 300px;
      }
      .absolute {
        position: absolute;
        inset: 0;
      }
      .inset-0 {
        inset: 0;
      }
      .demo-panel {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 10;
        max-height: 100%;
        overflow: auto;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
