name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: ESLint
        run: pnpm run eslint

      - name: Type Check
        run: pnpm run tsc

      - name: Unit Tests
        run: pnpm run test:unit:coverage

      - name: Build
        run: pnpm run build:ci
